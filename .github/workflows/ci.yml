name: Checks

on: [push]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payments_test
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: synthetic-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U payments_test -d payments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB__HOST: 127.0.0.1
      DB__PORT: "5432"
      DB__NAME: payments_test
      DB__USER: payments_test
      DB__PASSWORD: synthetic-test-password
      WEBHOOK_SECRET: synthetic-webhook-secret
      TEST_DATABASE_URL: postgresql+asyncpg://payments_test:synthetic-test-password@127.0.0.1:5432/payments_test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Run Ruff, mypy and pytest
        run: make check
